# Refresh the social wall (Facebook + Instagram) on demand. The same step also runs
# inside schedule.yml every three hours, so this is for "show the new post now"
# and for checking the token still works: a red run means it doesn't.
# Commits only data/social.json.
name: Refresh social posts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-refresh
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # carries on when a platform fails, so whichever one did refresh is still
      # committed; "Flag a broken social feed" then turns the run red
      - name: Fetch the newest Facebook and Instagram posts
        id: social
        continue-on-error: true
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: node scripts/build-social.js
      - name: Commit if anything changed
        run: |
          git config user.name  "sec-schedule-bot"
          git config user.email "actions@github.com"
          git add data/social.json
          if git diff --cached --quiet; then
            echo "no change - nothing to publish"
            exit 0
          fi
          git commit -m "Social: refresh posts"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
      - name: Flag a broken social feed
        if: steps.social.outcome == 'failure'
        run: |
          echo "::error title=Social posts are not updating::Facebook/Instagram could not be refreshed - see the 'Fetch the newest' step for why. Usual fix: make a new Page token and update the META_PAGE_TOKEN secret (README.md, 'Social wall')."
          exit 1
