# Refresh the Instagram tab of the social wall on demand. The same step also runs
# inside schedule.yml every three hours, so this is for "show the new post now"
# and for checking the token still works. Commits only data/social.json.
name: Refresh Instagram posts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-refresh
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the newest Instagram posts
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: node scripts/build-instagram.js
      - name: Commit if anything changed
        run: |
          git config user.name  "sec-schedule-bot"
          git config user.email "actions@github.com"
          git add data/social.json
          if git diff --cached --quiet; then
            echo "no change - nothing to publish"
            exit 0
          fi
          git commit -m "Instagram: refresh posts"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
