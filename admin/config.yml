    label: "Extra Page 3"
    description: "A blank page you can fill in and publish whenever it is ready. It has no nav tab and cannot be found on the site until Published is switched on below."
    files:
      - file: "data/pages/custom-3.json"
        label: "Extra Page 3"
        name: "extra-page-3"
        fields:
          - { label: "Internal note (do not edit)", name: "_comment", widget: "hidden",
              default: "Extra Page 3. Nothing here shows on the site - no nav tab, no reachable content - until published is set to true. file names the physical page this content belongs to; it must stay custom-3.html." }
          - { label: "Published (turn this on to make the page live)", name: "published", widget: "boolean", default: false,
              hint: "Off: nobody can find this page. On: it appears in the top menu and is publicly visible. Safe to flip back off at any time." }
          - { label: "Menu label", name: "navLabel", widget: "string", required: false,
              hint: "What appears in the top navigation once published, e.g. Coaches. Required for the page to actually get a menu tab." }
          - { label: "Page title", name: "pageTitle", widget: "string", required: false }
          - { label: "Eyebrow (small text above the title)", name: "eyebrow", widget: "string", required: false }
          - { label: "Intro text", name: "intro", widget: "text", required: false }
          - label: "Items"
            name: "items"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description (optional)", name: "description", widget: "text", required: false }
              - { label: "Link (optional)", name: "url", widget: "string", required: false }

  - name: "extra-page-4"
    label: "Extra Page 4"
    description: "A blank page you can fill in and publish whenever it is ready. It has no nav tab and cannot be found on the site until Published is switched on below."
    files:
      - file: "data/pages/custom-4.json"
        label: "Extra Page 4"
        name: "extra-page-4"
        fields:
          - { label: "Internal note (do not edit)", name: "_comment", widget: "hidden",
              default: "Extra Page 4. Nothing here shows on the site - no nav tab, no reachable content - until published is set to true. file names the physical page this content belongs to; it must stay custom-4.html." }
          - { label: "Published (turn this on to make the page live)", name: "published", widget: "boolean", default: false,
              hint: "Off: nobody can find this page. On: it appears in the top menu and is publicly visible. Safe to flip back off at any time." }
          - { label: "Menu label", name: "navLabel", widget: "string", required: false,
              hint: "What appears in the top navigation once published, e.g. Coaches. Required for the page to actually get a menu tab." }
          - { label: "Page title", name: "pageTitle", widget: "string", required: false }
          - { label: "Eyebrow (small text above the title)", name: "eyebrow", widget: "string", required: false }
          - { label: "Intro text", name: "intro", widget: "text", required: false }
          - label: "Items"
            name: "items"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description (optional)", name: "description", widget: "text", required: false }
              - { label: "Link (optional)", name: "url", widget: "string", required: false }
